name: Release

# A merge to main publishes a patch release; the manual trigger allows a
# minor or major bump. The version is derived from the latest `v*` tag, so the
# pipeline never releases the same version twice.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# Serialize releases: the version is computed from the tags created by the
# previous run, so two overlapping runs would pick the same number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # The workflow pushes the version bump itself; ignore that commit in
          # case the push ever comes from a token that does trigger workflows.
          if [[ "$MESSAGE" == *"[skip release]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force origin main

          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "$LATEST" ]; then
            # First release: ship the version that is already in the repo.
            VERSION="$(node -p "require('./package.json').version")"
          else
            BASE="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          node scripts/bump-version.mjs "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Version is already $VERSION, nothing to commit"
          else
            git commit -m "chore(release): v$VERSION [skip release]"
            git push origin HEAD:main
          fi

          SHA="$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
          - platform: windows-latest
            label: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Publish
    needs: [prepare, build]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # The bump commit was pushed by the prepare job.
          git fetch origin main --tags
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

          mapfile -t FILES < <(find dist -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' \) | sort)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No bundles were downloaded" >&2
            exit 1
          fi
          printf 'Publishing %s\n' "${FILES[@]}"

          gh release create "$TAG" "${FILES[@]}" \
            --title "MD Viewer $VERSION" \
            --generate-notes
