[package]
name = "md-viewer"
version = "0.1.0"
description = "Markdown viewer with a directory tree"
authors = ["lex"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Dominga/md-viewer.git"
rust-version = "1.77"

[lib]
name = "md_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
